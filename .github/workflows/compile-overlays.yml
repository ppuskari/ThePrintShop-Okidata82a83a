name: Compile Print Shop OkiGraph overlays

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/compile-overlays.yml"
      - "tools/patch_printshop_source.py"
      - "src/OKI8283.S"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate patched decoded source
        run: |
          mkdir -p build
          python tools/patch_printshop_source.py --output-dir build --check

      - name: Build Merlin32
        run: |
          git clone --depth 1 https://github.com/digarok/merlin32.git build/merlin32
          make -C build/merlin32/Source
          cp build/merlin32/Source/merlin32 build/merlin32-bin
          chmod +x build/merlin32-bin

      - name: Prepare original and patched Merlin32 sources
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from patch_printshop_source import load_image, binary_source_text

          d1 = load_image(None, 0)
          d2 = load_image(None, 1)
          Path("build/PRCOMS.ORIG.S").write_text(
              binary_source_text(d1, "PRCOMS.S"), encoding="ascii"
          )
          Path("build/MENUS7.ORIG.S").write_text(
              binary_source_text(d2, "MENUS7.S"), encoding="ascii"
          )
          Path("build/GCDRAW.ORIG.S").write_text(
              binary_source_text(d2, "GCDRAW.S"), encoding="ascii"
          )

          def normalize_bigmac(text):
              # Merlin32 accepts ordinary Big Mac syntax, but punctuation
              # character immediates such as #',' need numeric spelling.
              return re.sub(
                  r"#'([^'])'",
                  lambda m: "#$%02X" % ord(m.group(1)),
                  text,
              )

          def savify(src, out, save_name):
              text = normalize_bigmac(Path(src).read_text(encoding="ascii"))
              lines = text.splitlines()
              idx = next(
                  (i for i in range(len(lines)-1, -1, -1)
                   if lines[i].strip().upper() == "END"),
                  None,
              )
              if idx is None:
                  raise SystemExit(f"{src}: no final END")
              lines.insert(idx, f" SAV {save_name}")
              Path(out).write_text("\n".join(lines) + "\n", encoding="ascii")

          savify("build/PRCOMS.ORIG.S", "build/PRCOMS.ORIG.BUILD.S", "PRCOMS.ORIG")
          savify("build/PRCOMS.OKI.S",  "build/PRCOMS.OKI.BUILD.S",  "PRCOMS.OKI")
          savify("build/MENUS7.ORIG.S", "build/MENUS7.ORIG.BUILD.S", "MENUS7.ORIG")
          savify("build/MENUS7.OKI.S",  "build/MENUS7.OKI.BUILD.S",  "MENUS7.OKI")
          savify("build/GCDRAW.ORIG.S", "build/GCDRAW.ORIG.BUILD.S", "GCDRAW.ORIG")
          savify("build/GCDRAW.OKI.S",  "build/GCDRAW.OKI.BUILD.S",  "GCDRAW.OKI")
          PY

      - name: Assemble original and patched overlays
        run: |
          cd build
          ./merlin32-bin PRCOMS.ORIG.BUILD.S
          ./merlin32-bin PRCOMS.OKI.BUILD.S
          ./merlin32-bin MENUS7.ORIG.BUILD.S
          ./merlin32-bin MENUS7.OKI.BUILD.S
          ./merlin32-bin GCDRAW.ORIG.BUILD.S
          ./merlin32-bin GCDRAW.OKI.BUILD.S
          echo "=== OVERLAY OUTPUTS ==="
          ls -l PRCOMS.ORIG PRCOMS.OKI MENUS7.ORIG MENUS7.OKI GCDRAW.ORIG GCDRAW.OKI
          sha256sum PRCOMS.ORIG PRCOMS.OKI MENUS7.ORIG MENUS7.OKI GCDRAW.ORIG GCDRAW.OKI
          echo "=== BYTE DIFFERENCES ==="
          cmp -l PRCOMS.ORIG PRCOMS.OKI | head -40 || true
          cmp -l MENUS7.ORIG MENUS7.OKI | head -80 || true
          cmp -l GCDRAW.ORIG GCDRAW.OKI | head -80 || true

      - name: Inspect Print Shop v2.035 production image
        if: always()
        run: |
          curl -fL --retry 3 \
            "https://mirrors.apple2.org.za/ftp.apple.asimov.net/images/productivity/graphics/printshop/The%20Print%20Shop%20v2.035.2mg" \
            -o build/PrintShop-v2.035.2mg
          curl -fL --retry 3 \
            "https://github.com/AppleCommander/AppleCommander/releases/download/14.1/ac-linux-amd64-14.1" \
            -o build/ac
          chmod +x build/ac
          echo "=== PRODUCTION IMAGE DIRECTORY ==="
          build/ac -ll build/PrintShop-v2.035.2mg
          BASE="https://mirrors.apple2.org.za/ftp.apple.asimov.net/images/productivity/graphics/printshop"

          curl -fL --retry 3 "$BASE/PrintShop.dsk" -o build/PrintShop.dsk
          curl -fL --retry 3 "$BASE/ColorPrintShop.DSK" -o build/ColorPrintShop.DSK
          curl -fL --retry 3 "$BASE/The%20Print%20Shop%20%28Mr.%20Krac-Man%20crack%29%20-%20Side%201.dsk" -o build/Krac1.dsk
          curl -fL --retry 3 "$BASE/The%20Print%20Shop%20%28Mr.%20Krac-Man%20crack%29%20-%20Side%202.dsk" -o build/Krac2.dsk
          curl -fL --retry 3 "$BASE/The_Print_Shop_IIc_Plus.zip" -o build/IIcPlus.zip
          curl -fL --retry 3 "$BASE/The%20Print%20Shop%20%28woz-a-day%20collection%29.zip" -o build/WozADay.zip

          mkdir -p build/iicplus build/wozaday
          unzip -oq build/IIcPlus.zip -d build/iicplus
          unzip -oq build/WozADay.zip -d build/wozaday

          scan_image() {
            img="$1"
            tag=$(echo "$img" | tr '/ ' '__' | tr -cd 'A-Za-z0-9_.-')
            echo
            echo "=== CANDIDATE: $img ==="
            build/ac -ll "$img" || true
            for mod in PRCOMS MENUS7 GCDRAW; do
              out="build/runtime-$tag-$mod"
              rm -f "$out"
              if build/ac -g "$img" "$mod" "$out" 2>/dev/null; then
                echo "--- FOUND $mod in $img ---"
                ls -l "$out"
                sha256sum "$out"
                if [ "$mod" = "PRCOMS" ]; then
                  cmp -l build/PRCOMS.ORIG "$out" | head -20 || true
                elif [ "$mod" = "MENUS7" ]; then
                  cmp -l build/MENUS7.ORIG "$out" | head -20 || true
                else
                  cmp -l build/GCDRAW.ORIG "$out" | head -20 || true
                fi
              fi
            done
          }

          scan_image build/PrintShop.dsk
          scan_image build/ColorPrintShop.DSK
          scan_image build/Krac1.dsk
          scan_image build/Krac2.dsk

          while IFS= read -r img; do
            scan_image "$img"
          done < <(find build/iicplus build/wozaday -type f \
            \( -iname '*.dsk' -o -iname '*.do' -o -iname '*.po' -o -iname '*.2mg' -o -iname '*.woz' \) -print)

      - name: Upload compiled overlay diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: printshop-okigraph-compile-pass
          path: |
            build/PRCOMS.ORIG
            build/PRCOMS.OKI
            build/MENUS7.ORIG
            build/MENUS7.OKI
            build/GCDRAW.ORIG
            build/GCDRAW.OKI
          if-no-files-found: warn
