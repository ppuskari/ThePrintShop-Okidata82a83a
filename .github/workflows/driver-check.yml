name: Validate OkiGraph driver patch

on:
  workflow_dispatch:
  push:
    paths:
      - "src/driver_model.py"
      - "src/OKI8283.S"
      - "tests/test_driver_model.py"
      - "tools/inspect_printshop_source.py"
      - "tools/patch_printshop_source.py"
      - "scripts/Build-DriverSource.ps1"
      - ".github/workflows/driver-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run wire-level regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate R2 source transformation
        run: python tools/patch_printshop_source.py --check --output-dir build
